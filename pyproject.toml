[project]
name = "ndisplay-launcher-generator"
version = "0.1.0"
description = "Generate reusable nDisplay launcher shortcuts for Unreal projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ndisplay-launcher-generator = "ndisplay_launcher_generator.app:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.8.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndisplay_launcher_generator"]

[tool.pyinstaller]
entry = "src/ndisplay_launcher_generator/app.py"
name = "nDisplayLauncherGenerator"
onefile = true
windowed = true
